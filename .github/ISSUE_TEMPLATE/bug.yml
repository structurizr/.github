name: Bug report
description: Create a bug report
labels:
  - 'bug'

body:
  - type: textarea
    attributes:
      label: Expected
      description: What you expect to see.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Actual
      description: What you actually see.
    validations:
      required: true
  - type: textarea
    attributes:
      label: Steps to reproduce
      description: A step-by-step example (including code where applicable) of how to reproduce the bug. If you're using the Structurizr DSL, please add a full workspace definition (i.e. a model and views).
    validations:
      required: true
  - type: textarea
    attributes:
      label: Version
      description: The version number of the Structurizr software/library you are using.
    validations:
      required: true
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      options:
        - Minor
        - Major
        - Critical
    validations:
      required: true
  - type: textarea
    attributes:
      label: More information
      description: Please add anything else you think may be useful.

